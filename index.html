<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Таргетолог | Настройка рекламы Google, Facebook, Instagram и TikTok</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #e5e7eb;
      background: linear-gradient(180deg, #14532d 0%, #000000 100%);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(34,197,94,0.18), transparent 30%),
                  radial-gradient(circle at bottom left, rgba(22,163,74,0.14), transparent 35%);
      pointer-events: none;
      z-index: -1;
    }
    a { text-decoration: none; color: inherit; }
    .container { width: 90%; max-width: 1200px; margin: 0 auto; }

    header { background: linear-gradient(135deg, rgba(22,101,52,0.95), rgba(0,0,0,0.96)); color: #fff; padding: 24px 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.24); backdrop-filter: blur(10px); }
    .nav { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
    .logo { font-size: 26px; font-weight: 700; letter-spacing: 0.5px; animation: fadeUp 0.9s ease both; }
    .nav-links { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
    .nav-links a { color: #e5e7eb; font-size: 15px; transition: 0.3s; }
    .nav-links a:hover { color: #fff; }
    .btn { display: inline-block; background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; padding: 14px 26px; border-radius: 12px; font-weight: 700; transition: 0.3s; box-shadow: 0 10px 25px rgba(34,197,94,0.25); }
    .btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 14px 30px rgba(34,197,94,0.32); }

    .hero { padding: 80px 0 50px; background: linear-gradient(135deg, rgba(22,101,52,0.78) 0%, rgba(0,0,0,0.96) 100%); color: #fff; position: relative; }
    .hero-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center; }
    .hero h1 { font-size: 36px; line-height: 1.2; margin-bottom: 20px; animation: fadeUp 0.9s ease both; }
    .hero p { font-size: 16px; color: #d1d5db; margin-bottom: 30px; max-width: 100%; animation: fadeUp 1.1s ease both; }
    .hero-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.12); padding: 28px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.28); animation: floatCard 4s ease-in-out infinite; }
    .hero-list { list-style: none; }
    .hero-list li { margin-bottom: 12px; padding-left: 24px; position: relative; color: #f2f4f7; }
    .hero-list li::before { content: "✓"; position: absolute; left: 0; color: #22c55e; font-weight: bold; }

    section { padding: 60px 0; }
    .section-title { text-align: center; font-size: 28px; margin-bottom: 16px; color: #ffffff; }
    .section-subtitle { text-align: center; max-width: 95%; margin: 0 auto 30px; color: #d1d5db; font-size: 15px; }

    .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .card, .review, .form-box, .faq-item { background: rgba(255,255,255,0.06); padding: 20px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); transition: 0.35s; border: 1px solid rgba(255,255,255,0.10); backdrop-filter: blur(8px); }
    .card:hover, .review:hover, .form-box:hover, .faq-item:hover { transform: translateY(-6px); box-shadow: 0 12px 35px rgba(0,0,0,0.35); }
    .card-icon { width: 50px; height: 50px; font-size: 24px; margin-bottom: 14px; }
    .card h3 { font-size: 20px; }
    .card p { font-size: 14px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; text-align: center; }
    .stat-box h3 { font-size: 32px; }
    .stat-box p { font-size: 14px; }

    .reviews-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .review-text { font-size: 14px; }
    .review-author { font-size: 15px; }
    .review-role { font-size: 13px; }

    .faq-wrap { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .faq-image { height: auto; max-height: 250px; }
    .faq-item h3 { font-size: 18px; }
    .faq-item p { font-size: 14px; }

    .form-wrap { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .form-box { padding: 20px; }
    input, textarea, select { font-size: 14px; padding: 12px 14px; }
    button { font-size: 15px; padding: 12px; }

    .live-counter { left: 12px; bottom: 12px; padding: 10px 14px; }
    .popup-stack { left: 12px; right: 12px; bottom: 70px; max-width: none; }

    @media(min-width: 768px) { .hero-wrap { grid-template-columns: 1.2fr 0.8fr; } }
    @media(min-width: 992px) { .hero h1 { font-size: 48px; } }
  </style>
</head>
<body>
  <!-- Контент лендинга без изменений -->
</body>
</html>
