<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1em;
            text-align: center;
        }
        .content {
            padding: 15px;
        }
        @media (max-width: 600px) {
            header {
                font-size: 1.2em;
            }
            .content {
                font-size: 0.9em;
            }
        }
        @media (min-width: 601px) {
            header {
                font-size: 1.5em;
            }
            .content {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Responsive Page</h1>
    </header>
    <div class="content">
        <p>This is an example of a simple responsive webpage that adapts to different screen sizes by using media queries for mobile devices.</p>
    </div>
</body>
</html>
