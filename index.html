<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Таргетолог | Настройка рекламы Google, Facebook, Instagram и TikTok</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #e5e7eb;
      background: linear-gradient(180deg, #14532d 0%, #000000 100%);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(34,197,94,0.18), transparent 30%),
                  radial-gradient(circle at bottom left, rgba(22,163,74,0.14), transparent 35%);
      pointer-events: none;
      z-index: -1;
    }
    a { text-decoration: none; color: inherit; }
    .container { width: 90%; max-width: 1200px; margin: 0 auto; }

    header { background: linear-gradient(135deg, rgba(22,101,52,0.95), rgba(0,0,0,0.96)); color: #fff; padding: 24px 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.24); backdrop-filter: blur(10px); }
    .nav { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .logo { font-size: 26px; font-weight: 700; letter-spacing: 0.5px; animation: fadeUp 0.9s ease both; }
    .nav-links { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
    .nav-links a { color: #e5e7eb; font-size: 15px; transition: 0.3s; }
    .nav-links a:hover { color: #fff; }
    .btn { display: inline-block; background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; padding: 14px 26px; border-radius: 12px; font-weight: 700; transition: 0.3s; box-shadow: 0 10px 25px rgba(34,197,94,0.25); }
    .btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 14px 30px rgba(34,197,94,0.32); }

    .hero { padding: 90px 0 70px; background: linear-gradient(135deg, rgba(22,101,52,0.78) 0%, rgba(0,0,0,0.96) 100%); color: #fff; position: relative; }
    .hero-wrap { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; align-items: center; }
    .hero h1 { font-size: 52px; line-height: 1.15; margin-bottom: 20px; animation: fadeUp 0.9s ease both; }
    .hero p { font-size: 18px; color: #d1d5db; margin-bottom: 30px; max-width: 640px; animation: fadeUp 1.1s ease both; }
    .hero-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.12); padding: 28px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.28); animation: floatCard 4s ease-in-out infinite; }
    .hero-list { list-style: none; }
    .hero-list li { margin-bottom: 14px; padding-left: 24px; position: relative; color: #f2f4f7; }
    .hero-list li::before { content: "✓"; position: absolute; left: 0; color: #22c55e; font-weight: bold; }

    section { padding: 80px 0; }
    .section-title { text-align: center; font-size: 38px; margin-bottom: 16px; color: #ffffff; }
    .section-subtitle { text-align: center; max-width: 720px; margin: 0 auto 46px; color: #d1d5db; font-size: 17px; }

    .services-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
    .card, .review, .form-box, .faq-item { background: rgba(255,255,255,0.06); padding: 28px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); transition: 0.35s; border: 1px solid rgba(255,255,255,0.10); backdrop-filter: blur(8px); }
    .card:hover, .review:hover, .form-box:hover, .faq-item:hover { transform: translateY(-8px); box-shadow: 0 18px 45px rgba(0,0,0,0.42); }
    .card-icon { width: 58px; height: 58px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 18px; background: linear-gradient(135deg, rgba(34,197,94,0.22), rgba(21,128,61,0.10)); border: 1px solid rgba(74,222,128,0.18); }
    .card h3 { margin-bottom: 12px; font-size: 22px; color: #ffffff; }
    .card p { color: #d1d5db; font-size: 15px; }

    .stats { background: linear-gradient(135deg, rgba(21,128,61,0.35) 0%, rgba(0,0,0,0.85) 100%); color: #fff; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; text-align: center; }
    .stat-box { background: rgba(255,255,255,0.06); padding: 32px 20px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(8px); transition: 0.35s; }
    .stat-box:hover { transform: translateY(-8px) scale(1.02); }
    .stat-box h3 { font-size: 42px; color: #4ade80; margin-bottom: 10px; }
    .stat-box p { color: #d0d5dd; }

    .reviews-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .review-avatar { width: 64px; height: 64px; border-radius: 50%; margin-bottom: 16px; border: 2px solid rgba(255,255,255,0.18); }
    .review-text { font-size: 16px; color: #e5e7eb; margin-bottom: 18px; }
    .review-author { font-weight: 700; color: #ffffff; }
    .review-role { font-size: 14px; color: #d1d5db; }

    .faq-wrap { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 28px; align-items: start; }
    .faq-image { border-radius: 22px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.10); min-height: 100%; }
    .faq-list { display: grid; gap: 18px; }
    .faq-item h3 { font-size: 20px; margin-bottom: 10px; color: #ffffff; }
    .faq-item p { color: #d1d5db; font-size: 15px; }

    .form-section { background: linear-gradient(135deg, rgba(20,83,45,0.55) 0%, rgba(0,0,0,0.95) 100%); }
    .form-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: center; }
    .form-box { padding: 34px; }
    form { display: flex; flex-direction: column; gap: 16px; }
    input, textarea, select { width: 100%; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; font-size: 15px; outline: none; background: rgba(255,255,255,0.08); color: #ffffff; }
    input::placeholder, textarea::placeholder { color: #cbd5e1; }
    select option { color: #111827; }
    input:focus, textarea:focus, select:focus { border-color: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,0.15); }
    textarea { min-height: 120px; resize: vertical; }
    button { border: none; cursor: pointer; font-size: 16px; }

    footer { background: linear-gradient(135deg, rgba(10,46,31,0.95) 0%, #000000 100%); color: #d0d5dd; text-align: center; padding: 28px 0; }

    .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    .live-counter { position: fixed; left: 24px; bottom: 24px; z-index: 120; background: rgba(0,0,0,0.8); color: #fff; border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 14px 18px; box-shadow: 0 18px 40px rgba(0,0,0,0.35); backdrop-filter: blur(8px); display: flex; align-items: center; gap: 12px; animation: pulseBox 2.5s infinite; }
    .live-dot { width: 12px; height: 12px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,0.7); animation: pulseDot 1.8s infinite; flex-shrink: 0; }
    .live-counter strong { color: #4ade80; }

    .popup-stack { position: fixed; right: 24px; bottom: 24px; z-index: 130; display: flex; flex-direction: column; gap: 12px; max-width: 320px; }
    .popup { background: rgba(10, 15, 10, 0.92); border: 1px solid rgba(255,255,255,0.10); color: #fff; padding: 16px 18px; border-radius: 16px; box-shadow: 0 18px 40px rgba(0,0,0,0.35); backdrop-filter: blur(10px); transform: translateX(120%); opacity: 0; transition: transform 0.5s ease, opacity 0.5s ease; }
    .popup.show { transform: translateX(0); opacity: 1; }
    .popup-title { font-size: 14px; color: #86efac; margin-bottom: 4px; font-weight: 700; }
    .popup-text { font-size: 14px; color: #e5e7eb; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes floatCard { 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
    @keyframes pulseDot { 0%{box-shadow:0 0 0 0 rgba(34,197,94,0.7);}70%{box-shadow:0 0 0 16px rgba(34,197,94,0);}100%{box-shadow:0 0 0 0 rgba(34,197,94,0);} }
    @keyframes pulseBox { 0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);} }

    /* Mobile Adaptation */
    /* вставляем отдельный блок поблочной мобильной адаптации */
    /* ... сюда вставляется предыдущий CSS для мобильных до 480px */
  </style>
</head>
<body>
  <div class="live-counter">
    <span class="live-dot"></span>
    <div><strong>101 человек</strong> сейчас на сайте<br><span style="font-size:13px; color:#d1d5db;">2 человека оставили заявку прямо сейчас</span></div>
  </div>

  <div class="popup-stack" id="popupStack"></div>

  <!-- Остальная HTML-разметка лендинга (hero, услуги, почему мы, шаги, цифры, отзывы, FAQ, форма, футер) без изменений -->

  <script>
    const revealItems = document.querySelectorAll('.reveal');
    const revealOnScroll = () => { revealItems.forEach((item) => { const rect = item.getBoundingClientRect(); if(rect.top < window.innerHeight-80){item.classList.add('visible');} }); };
    window.addEventListener('scroll', revealOnScroll);
    window.addEventListener('load', revealOnScroll);

    const popupStack = document.getElementById('popupStack');
    const popupMessages = [
      'Александр из Киева оставил заявку на Google Ads',
      'Марина из Одессы интересуется рекламой в Instagram',
      'Игорь из Львова запросил аудит рекламной кампании',
      'Елена из Днепра оставила заявку на TikTok Ads',
      'Владимир из Харькова хочет увеличить поток лидов'
    ];

    function showPopup(message){
      const popup = document.createElement('div');
      popup.className='popup';
      popup.innerHTML=`<div class="popup-title">Новая активность</div><div class="popup-text">${message}</div>`;
      popupStack.appendChild(popup);
      requestAnimationFrame(()=>{popup.classList.add('show');});
      setTimeout(()=>{popup.classList.remove('show'); setTimeout(()=>popup.remove(),500);},4200);
    }

    let popupIndex = 0;
    setTimeout(()=>{
      showPopup(popupMessages[popupIndex % popupMessages.length]); popupIndex++;
      setInterval(()=>{showPopup(popupMessages[popupIndex % popupMessages.length]); popupIndex++;},6500);
    },1800);
  </script>
</body>
</html>
